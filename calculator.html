<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Калькулятор</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #eef2f7;
      color: #172033;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #eef2f7;
    }
    .calculator {
      width: min(100%, 360px);
      padding: 20px;
      border: 1px solid #dce3ee;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 18px 45px rgba(31, 48, 79, .14);
    }
    h1 { margin: 0 0 14px; font-size: 20px; font-weight: 650; }
    .display {
      width: 100%;
      min-height: 84px;
      margin-bottom: 14px;
      padding: 14px;
      overflow: hidden;
      border: 1px solid #dce3ee;
      border-radius: 10px;
      background: #f7f9fc;
      text-align: right;
      font-size: 36px;
      line-height: 1.25;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
    button {
      min-height: 54px;
      border: 1px solid #d6deea;
      border-radius: 9px;
      background: #f8fafc;
      color: #172033;
      font: inherit;
      font-size: 20px;
      cursor: pointer;
      transition: background .12s, transform .12s;
    }
    button:hover { background: #eaf0f8; }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid #8bb8ff; outline-offset: 2px; }
    .operator { background: #e8f0ff; color: #1457b8; }
    .equals { background: #1769d2; border-color: #1769d2; color: white; }
    .equals:hover { background: #0f58b6; }
    .utility { color: #5d687a; }
    .wide { grid-column: span 2; }
    .hint { margin: 13px 0 0; color: #748096; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Калькулятор">
    <h1>Калькулятор</h1>
    <output id="display" class="display" aria-live="polite">0</output>
    <section class="keys" aria-label="Кнопки калькулятора">
      <button class="utility" data-action="clear">AC</button>
      <button class="utility" data-action="backspace" aria-label="Удалить последний символ">⌫</button>
      <button class="utility" data-action="percent">%</button>
      <button class="operator" data-value="÷">÷</button>
      <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="operator" data-value="×">×</button>
      <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="operator" data-value="−">−</button>
      <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="operator" data-value="+">+</button>
      <button class="wide" data-value="0">0</button><button data-value=".">.</button><button class="equals" data-action="equals">=</button>
    </section>
    <p class="hint">Можно вводить числа и операции с клавиатуры</p>
  </main>
  <script>
    const display = document.querySelector('#display');
    let expression = '';
    let justCalculated = false;

    function render() { display.textContent = expression || '0'; }
    function append(value) {
      if (justCalculated && /[0-9.]/.test(value)) expression = '';
      justCalculated = false;
      if (value === '.') {
        const current = expression.split(/[+−×÷]/).pop();
        if (current.includes('.')) return;
        if (!current) expression += '0';
      }
      if (/^[+−×÷]$/.test(value)) {
        if (!expression && value !== '−') return;
        if (/[+−×÷]$/.test(expression)) expression = expression.slice(0, -1);
      }
      expression += value;
      render();
    }
    function calculate() {
      if (!expression || /[+−×÷.]$/.test(expression)) return;
      const safe = expression.replaceAll('×', '*').replaceAll('÷', '/').replaceAll('−', '-');
      if (!/^[0-9+*/(). -]+$/.test(safe)) return;
      try {
        const result = Function('"use strict"; return (' + safe + ')')();
        if (!Number.isFinite(result)) throw new Error('invalid');
        expression = String(Math.round(result * 1e10) / 1e10);
        justCalculated = true;
        render();
      } catch { display.textContent = 'Ошибка'; expression = ''; }
    }
    document.querySelector('.keys').addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      const action = button.dataset.action;
      if (action === 'clear') { expression = ''; justCalculated = false; render(); }
      else if (action === 'backspace') { expression = expression.slice(0, -1); render(); }
      else if (action === 'percent') { expression = expression.replace(/(\d+(?:\.\d+)?)$/, n => String(Number(n) / 100)); render(); }
      else if (action === 'equals') calculate();
      else append(button.dataset.value);
    });
    document.addEventListener('keydown', event => {
      const map = { '/': '÷', '*': '×', '-': '−', '+': '+', '.': '.', ',': '.', 'Enter': 'equals', '=': 'equals', 'Escape': 'clear', 'Backspace': 'backspace', '%': 'percent' };
      const value = map[event.key] || (/[0-9]/.test(event.key) ? event.key : null);
      if (!value) return;
      event.preventDefault();
      if (value === 'equals') calculate();
      else if (value === 'clear') { expression = ''; render(); }
      else if (value === 'backspace') { expression = expression.slice(0, -1); render(); }
      else if (value === 'percent') { expression = expression.replace(/(\d+(?:\.\d+)?)$/, n => String(Number(n) / 100)); render(); }
      else append(value);
    });
  </script>
</body>
</html>
